# Refreshes output/dining.json from Brown Dining every hour and commits it if the menus changed.
# Works once this folder is a GitHub repo; the site (output/) can then be served by GitHub Pages.
name: Update dining menus

on:
  schedule:
    - cron: "17 * * * *"   # hourly, at :17 (GitHub cron runs in UTC; off the hour to dodge the rush)
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 fetch_dining.py
      - name: Commit if changed
        run: |
          git diff --quiet output/dining.json && exit 0
          git config user.name "SQUADELDEE"
          git config user.email "80926921+SQUADELDEE@users.noreply.github.com"
          git add output/dining.json
          git commit -m "Update dining menus"
          git push
